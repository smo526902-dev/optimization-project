<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720"><defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1A1A1A"/></marker>
<marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#1A1A1A" stroke-width="1.4"/></marker>
<marker id="tri" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M1 1 L13 7 L1 13 z" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.3"/></marker>
<marker id="diamond" viewBox="0 0 18 10" refX="17" refY="5" markerWidth="18" markerHeight="10" orient="auto-start-reverse"><path d="M1 5 L9 1 L17 5 L9 9 z" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="1"/></marker>
<marker id="odiamond" viewBox="0 0 18 10" refX="17" refY="5" markerWidth="18" markerHeight="10" orient="auto-start-reverse"><path d="M1 5 L9 1 L17 5 L9 9 z" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.2"/></marker>
</defs><rect width="100%" height="100%" fill="#FFFFFF"/><circle cx="330" cy="30" r="11" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="1.4"/>
<text x="350" y="30" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#555555" dominant-baseline="middle">start point x, step h (one per variable), budget</text>
<rect x="110.0" y="72.0" width="440" height="56" rx="16" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.4"/>
<text x="330" y="91.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1A1A1A" dominant-baseline="middle">Exploratory move: for each variable try</text>
<text x="330" y="108.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1A1A1A" dominant-baseline="middle">x_i + h_i, then x_i − h_i; keep the first improvement</text>
<polygon points="330,173.0 430.0,210 330,247.0 230.0,210" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.4"/>
<text x="330" y="210.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#1A1A1A" dominant-baseline="middle">Improved?</text>
<rect x="110.0" y="292.0" width="440" height="56" rx="16" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.4"/>
<text x="330" y="311.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1A1A1A" dominant-baseline="middle">Pattern move: jump to x_new + (x_new − x_base)</text>
<text x="330" y="328.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1A1A1A" dominant-baseline="middle">and explore around it</text>
<polygon points="330,393.0 430.0,430 330,467.0 230.0,430" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.4"/>
<text x="330" y="421.5" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#1A1A1A" dominant-baseline="middle">Still</text>
<text x="330" y="438.5" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#1A1A1A" dominant-baseline="middle">improving?</text>
<rect x="590.0" y="185.0" width="220" height="50" rx="16" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.4"/>
<text x="700" y="210.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1A1A1A" dominant-baseline="middle">Halve every step h_i</text>
<polygon points="700,288.0 815.0,330 700,372.0 585.0,330" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.4"/>
<text x="700" y="321.5" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#1A1A1A" dominant-baseline="middle">Budget left and</text>
<text x="700" y="338.5" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#1A1A1A" dominant-baseline="middle">h &gt; 1e-10 · width?</text>
<rect x="590.0" y="445.0" width="220" height="50" rx="16" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.4"/>
<text x="700" y="470.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1A1A1A" dominant-baseline="middle">Return x, f(x) and h</text>
<path d="M330 41 L330 72" fill="none" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M330 128 L330 173" fill="none" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M330 247 L330 292" fill="none" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="340" y="268" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#555555" dominant-baseline="middle">yes</text>
<path d="M330 348 L330 393" fill="none" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M230 430 L60 430 L60 320 L110 320" fill="none" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="68" y="418" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#555555" dominant-baseline="middle">yes</text>
<path d="M330 467 L330 540 L40 540 L40 100 L110 100" fill="none" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="340" y="500" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#555555" dominant-baseline="middle">no: explore from</text>
<text x="340" y="517" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#555555" dominant-baseline="middle">the new base</text>
<path d="M430 210 L590 210" fill="none" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="455" y="198" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#555555" dominant-baseline="middle">no</text>
<path d="M700 235 L700 288" fill="none" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M815 330 L860 330 L860 60 L330 60 L330 72" fill="none" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="868" y="200" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#555555" dominant-baseline="middle">yes</text>
<path d="M700 372 L700 445" fill="none" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="710" y="408" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#555555" dominant-baseline="middle">no</text>
<path d="M700 495 L700 545" fill="none" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#arrow)"/>
<circle cx="700" cy="560" r="14" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.4"/>
<circle cx="700" cy="560" r="8" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="1.4"/>
<polygon points="80,600 626,600 640,614 640,692 80,692" fill="#FFF8DC" stroke="#1A1A1A" stroke-width="1.4"/>
<path d="M626 600 L626 614 L640 614" fill="none" stroke="#1A1A1A" stroke-width="1.1"/>
<text x="90" y="618" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#1A1A1A" dominant-baseline="middle">Derivative-free: it only compares f values. Pattern moves</text>
<text x="90" y="635" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#1A1A1A" dominant-baseline="middle">accelerate along valleys, which is why the MA solves</text>
<text x="90" y="652" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#1A1A1A" dominant-baseline="middle">Rosenbrock where the GA stalls. Each trial point costs one</text>
<text x="90" y="669" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#1A1A1A" dominant-baseline="middle">evaluation through Problem.evaluate.</text></svg>