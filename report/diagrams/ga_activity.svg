<svg xmlns="http://www.w3.org/2000/svg" width="980" height="830" viewBox="0 0 980 830"><defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1A1A1A"/></marker>
<marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#1A1A1A" stroke-width="1.4"/></marker>
<marker id="tri" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M1 1 L13 7 L1 13 z" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.3"/></marker>
<marker id="diamond" viewBox="0 0 18 10" refX="17" refY="5" markerWidth="18" markerHeight="10" orient="auto-start-reverse"><path d="M1 5 L9 1 L17 5 L9 9 z" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="1"/></marker>
<marker id="odiamond" viewBox="0 0 18 10" refX="17" refY="5" markerWidth="18" markerHeight="10" orient="auto-start-reverse"><path d="M1 5 L9 1 L17 5 L9 9 z" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.2"/></marker>
</defs><rect width="100%" height="100%" fill="#FFFFFF"/><circle cx="360" cy="30" r="11" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="1.4"/>
<rect x="170.0" y="70.0" width="380" height="50" rx="16" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.4"/>
<text x="360" y="95.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1A1A1A" dominant-baseline="middle">Initialise N individuals uniformly in the domain</text>
<rect x="170.0" y="150.0" width="380" height="50" rx="16" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.4"/>
<text x="360" y="175.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1A1A1A" dominant-baseline="middle">Evaluate them (FEs += N)</text>
<polygon points="360,233.0 460.0,270 360,307.0 260.0,270" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.4"/>
<text x="360" y="270.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#1A1A1A" dominant-baseline="middle">Budget left?</text>
<rect x="170.0" y="345.0" width="380" height="50" rx="16" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.4"/>
<text x="360" y="370.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1A1A1A" dominant-baseline="middle">Select parents: tournament of k = 3</text>
<rect x="170.0" y="425.0" width="380" height="50" rx="16" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.4"/>
<text x="360" y="450.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1A1A1A" dominant-baseline="middle">Crossover pairs: SBX, p_c = 0.9</text>
<rect x="170.0" y="505.0" width="380" height="50" rx="16" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.4"/>
<text x="360" y="530.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1A1A1A" dominant-baseline="middle">Mutate genes: polynomial, p_m = 1/d</text>
<rect x="170.0" y="585.0" width="380" height="50" rx="16" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.4"/>
<text x="360" y="610.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1A1A1A" dominant-baseline="middle">Evaluate the N − 2 children (FEs += N − 2)</text>
<rect x="170.0" y="665.0" width="380" height="50" rx="16" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.4"/>
<text x="360" y="690.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1A1A1A" dominant-baseline="middle">Keep the 2 best parents (elitism) + the children</text>
<rect x="170.0" y="741.0" width="380" height="58" rx="16" fill="#EEF2EC" stroke="#1A1A1A" stroke-width="1.4"/>
<text x="360" y="761.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1A1A1A" dominant-baseline="middle">Learn: nothing in the GA</text>
<text x="360" y="778.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1A1A1A" dominant-baseline="middle">(the MA refines individuals here)</text>
<path d="M360 41 L360 70" fill="none" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M360 120 L360 150" fill="none" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M360 200 L360 233" fill="none" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M360 307 L360 345" fill="none" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M360 395 L360 425" fill="none" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M360 475 L360 505" fill="none" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M360 555 L360 585" fill="none" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M360 635 L360 665" fill="none" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M360 715 L360 741" fill="none" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="370" y="326" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#555555" dominant-baseline="middle">yes</text>
<path d="M170 770 L60 770 L60 270 L260 270" fill="none" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="40" y="520" font-family="Arial" font-size="12" fill="#555" transform="rotate(-90 40 520)" text-anchor="middle">next generation</text>
<path d="M460 270 L690 270 L690 340" fill="none" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="490" y="258" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#555555" dominant-baseline="middle">no</text>
<rect x="570.0" y="341.0" width="240" height="58" rx="16" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.4"/>
<text x="690" y="361.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1A1A1A" dominant-baseline="middle">Return the best solution</text>
<text x="690" y="378.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1A1A1A" dominant-baseline="middle">found (RunResult)</text>
<path d="M690 399 L690 445" fill="none" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#arrow)"/>
<circle cx="690" cy="460" r="14" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.4"/>
<circle cx="690" cy="460" r="8" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="1.4"/>
<polygon points="600,560 946,560 960,574 960,652 600,652" fill="#FFF8DC" stroke="#1A1A1A" stroke-width="1.4"/>
<path d="M946 560 L946 574 L960 574" fill="none" stroke="#1A1A1A" stroke-width="1.1"/>
<text x="610" y="578" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#1A1A1A" dominant-baseline="middle">Every evaluation goes through</text>
<text x="610" y="595" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#1A1A1A" dominant-baseline="middle">Problem.evaluate: it is counted, and a call past</text>
<text x="610" y="612" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#1A1A1A" dominant-baseline="middle">the budget of 10,000 · d returns +∞, so the</text>
<text x="610" y="629" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#1A1A1A" dominant-baseline="middle">point can never be selected.</text>
<path d="M600 606 L550 610" fill="none" stroke="#1A1A1A" stroke-width="1.4" stroke-dasharray="4 3"/></svg>